<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>NAS Manager - Connexion</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-body">
  <div class="login-card">
    <h1><span class="logo-dot"></span> NAS Manager</h1>
    <p class="login-sub">Gestion NAS - connexion avec ton compte systeme</p>
    {% if error %}<div class="msg msg-error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <label for="username">Compte systeme</label>
      <input type="text" id="username" name="username" autocomplete="username" required>
      <label for="password">Mot de passe</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit" class="btn-primary" style="margin-top:1.4rem;">Se connecter</button>
    </form>
  </div>
</body>
</html>
